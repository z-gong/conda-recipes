{% set name = "openmm-velocityverlet" %}
{% set version = "1.1.0" %}
{% set url="https://github.com/z-gong/openmm-velocityVerlet" %}
{% set build = 1 %}
{% set cuda_version_min = "12.0" %} # 12.0 is the minimal CUDA version that works with conda-forge repo
{% set cuda_version_max = "13" %} # package built with CUDA 12.0 should work with CUDA 12.x
{% set openmm_version = "8.5.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  git_url: {{ url }}
  git_branch: dev

build:
  number: {{ build }}
  string: openmm851_{{ build }}

requirements:
  build:
    - python
    - cython
    - numpy
    - swig
    - doxygen
    - cmake <4
    - make
    - gxx
    - cuda-version {{ cuda_version_min }}
    - cuda-compiler
    - cuda-nvrtc-dev
    - cuda-profiler-api
    - openmm {{ openmm_version }}

  run:
    - python
    - numpy
    - cuda-version >={{ cuda_version_min }},<{{ cuda_version_max }}
    - cuda-cudart
    - cuda-nvrtc
    - openmm {{ openmm_version }}

about:
  home: {{ url }}
  license: LGPL-3.0-or-later
  license_family: LGPL
  summary: OpenMM plugin for simulating electrochemical systems

  description: |
    This plugin works with OpenMM to perform velocity-Verlet integration,
    along with various simulation methods that can not be done easily with CustomIntegrator.
